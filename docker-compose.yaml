services:
  server:
    build:
      context: ./apps/backend/
      dockerfile: Dockerfile
    container_name: express-backend
    ports:
      - "3000:3000"
    volumes:
      - ./apps/backend/:/apps/backend
    restart: always

  client:
    build:
      context: ./apps/frontend/
      dockerfile: Dockerfile
    container_name: react-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./apps/frontend/:/apps/frontend
    restart: always
