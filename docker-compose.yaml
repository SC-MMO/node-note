services:
  backend:
    build:
      context: ./apps/backend/
      dockerfile: Dockerfile
    container_name: node-note-backend
    ports:
      - "3000:3000"
    volumes:
      - ./apps/backend/:/apps/backend
    restart: always

  frontend:
    build:
      context: ./apps/frontend/
      dockerfile: Dockerfile
    container_name: node-note-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./apps/frontend/:/apps/frontend
    restart: always


  nginx:
    container_name: node-note-nginx
    build:
      context: ./nginx/
      dockerfile: Dockerfile
    volumes:
      - ./nginx/certs/:/etc/ssl/certs
      - ./nginx/private/:/etc/ssl/private
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    restart: always
